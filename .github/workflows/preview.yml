name: Vercel Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - master

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/try-online/package-lock.json

      - name: Install dependencies
        working-directory: examples/try-online
        run: npm ci

      - name: Build application
        working-directory: examples/try-online
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Preview
        working-directory: examples/try-online
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          VERCEL_OUTPUT=$(vercel --prod --token="${VERCEL_TOKEN}" --yes 2>&1)
          echo "$VERCEL_OUTPUT"
          echo "VERCEL_PREVIEW_URL=$(echo "$VERCEL_OUTPUT" | grep -o 'https://stellar-hooks-.*vercel.app')" >> $GITHUB_ENV

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: { number } } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const previewUrl = process.env.VERCEL_PREVIEW_URL || 'https://stellar-hooks-git-${{ github.head_ref || github.ref_name }}-stellar-hooks.vercel.app';
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: `🚀 **Preview Deployment**\\n\\nView your changes here:\\n${previewUrl}\\n\\n*This preview is generated from your PR branch and may be updated as you push new commits.*
`
            });
