name: Validate Dependabot Config

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
  push:
    branches: ['main']
    paths:
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate dependabot.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dependabot.yml
        uses: marocchino/validate-dependabot@v3
        with:
          file: .github/dependabot.yml
