version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Group Stellar SDK packages together
      stellar:
        patterns:
          - '@stellar/*'
        exclude-patterns:
          - '@stellar/*-dev'
        update-types:
          - "minor"
          - "patch"
      # Group React ecosystem packages
      react:
        patterns:
          - react
          - react-dom
          - react-test-renderer
          - '@types/react'
          - '@types/react-dom'
          - '@types/react-test-renderer'
        update-types:
          - "minor"
          - "patch"
      # Group testing packages
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - jsdom
          - '@types/jest'
          - '@types/jsdom'
          - '@types/react-test-renderer'
        update-types:
          - "minor"
          - "patch"
      # Group ESLint/TypeScript ecosystem
      eslint:
        patterns:
          - eslint
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
        update-types:
          - "minor"
          - "patch"
      # Group Prettier and formatters
      format:
        patterns:
          - prettier
          - '@prettier/*'
          - 'prettier-plugin-*'
        update-types:
          - "minor"
          - "patch"
      # Group Changesets for release management
      changesets:
        patterns:
          - '@changesets/*'
          - changesets
        update-types:
          - "minor"
          - "patch"
      # Group Semantic Release for automated releases
      semantic-release:
        patterns:
          - semantic-release
          - '@semantic-release/*'
        update-types:
          - "minor"
          - "patch"
      # Group Doc generation tools
      docs:
        patterns:
          - typedoc
          - '@types/typedoc'
          - vitepress
        update-types:
          - "minor"
          - "patch"
      # Group Storybook
      storybook:
        patterns:
          - '@storybook/*'
          - storybook
        update-types:
          - "minor"
          - "patch"
      # Group all other development dependencies
      dev:
        patterns:
          - '*'
        exclude-patterns:
          - '@stellar/*'
          - react
          - react-dom
          - '@types/react*'
          - vitest
          - '@vitest/*'
          - '@testing-library/*'
          - jsdom
          - eslint
          - '@typescript-eslint/*'
          - prettier
          - '@prettier/*'
          - '@changesets/*'
          - semantic-release
          - '@semantic-release/*'
          - typedoc
          - '@types/typedoc'
          - vitepress
          - '@storybook/*'
          - storybook
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore non-critical action updates during testing
      - dependency-name: '*'
        update-types:
          - "version-update:semver-patch"
